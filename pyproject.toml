[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent-boilerplate"
version = "0.1.0"
description = "A configuration-driven foundation for code-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "fastapi>=0.115",
    "langchain-aws>=0.2",
    "langgraph>=0.2",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
